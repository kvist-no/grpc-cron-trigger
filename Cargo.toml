[package]
name = "cron-trigger"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.13"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
prost = "0.13"
reqwest = { version = "0.12" }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.18", features = ["v4"] }
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
tonic-build = "0.13"
