name: Rust

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        # The unpinned stable toolchain gained result_large_err, which fails
        # -D warnings on existing code. Allow it rather than block releases.
        run: cargo clippy -- -D warnings -A clippy::result_large_err

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            europe-north1-docker.pkg.dev/dev-vinci/infrastructure/${{ github.repository }}
            europe-north1-docker.pkg.dev/backend-prod-347716/infrastructure/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value={{date 'YYYY-MM-DDTHH:mm:ss' tz='Europe/Madrid' }}

      # Short-lived Google credential through the GitHub OIDC federation in
      # kvist-no/infra (opentofu/modules/gcp-backend-registry/github.tf).
      # Only pushes to the default branch are trusted by that provider.
      - id: google-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/388850703528/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: infra-image-publisher@dev-vinci.iam.gserviceaccount.com
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: europe-north1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.google-auth.outputs.access_token }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          platforms: linux/amd64
